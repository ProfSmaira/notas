<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno - Seleção de Disciplina</title>
    <style>
        :root {
            --ufscar-blue: #004a8e;
            --bg-gray: #f0f2f5;
            --text-main: #333;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-gray); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 15px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            text-align: center; 
            max-width: 420px; 
            width: 100%;
            border-top: 6px solid var(--ufscar-blue);
        }
        .spinner { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid var(--ufscar-blue); 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 1.5rem; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        h1 { font-size: 1.5rem; color: var(--ufscar-blue); margin-top: 0; margin-bottom: 0.5rem; }
        p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }

        .form-group { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        label { font-size: 0.85rem; font-weight: 600; color: #555; }
        
        select, button {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 8px;
            border: 2px solid #e1e4e8;
            box-sizing: border-box;
        }
        select:focus { outline: none; border-color: var(--ufscar-blue); }

        .btn-submit {
            background-color: var(--ufscar-blue);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover { background-color: #00366b; }
        
        .footer { font-size: 0.75rem; color: #aaa; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="card">
        <div id="loadingState">
            <div class="spinner"></div>
            <h1>Portal do Aluno</h1>
            <p class="subtitle">Redirecionando para o seu dashboard...</p>
        </div>

        <div id="selectState" style="display: none;">
            <h1>Portal do Aluno</h1>
            <p class="subtitle">Selecione o período e a disciplina para acessar o painel de notas:</p>

            <form id="selectionForm" class="form-group">
                <div>
                    <label for="yearSelect">Ano Letivo</label>
                    <select id="yearSelect" required></select>
                </div>

                <div>
                    <label for="semesterSelect">Semestre</label>
                    <select id="semesterSelect" required></select>
                </div>

                <div>
                    <label for="subjectSelect">Disciplina</label>
                    <select id="subjectSelect" required></select>
                </div>

                <button type="submit" class="btn-submit">Acessar Painel →</button>
            </form>
        </div>

        <div class="footer">Prof. André de Freitas Smaira</div>
    </div>

    <script>
        // --- CENTRAL DE DEPLOYS ---
        // Organize por Ano -> Semestre -> Disciplina -> ID do Apps Script
        const DEPLOYS = {
            "2026": {
                "1": {
                    "PA1": "AKfycbz3a6pmevKs7xLd7krmL1mJKaj-Skdf2xrbJaBYySgTItvDueoaGuxElGqZEKYGYy8I",
                    "ORI": "AKfycbyko1Mc0T0VDDj1VpEP8PV2fW6mpBhhjpbgBxnLqL6yFdjLD4NllMSkUG_glVv_PaYW"
                },
                "2": {
                    "TBDES": "AKfycbyB8Qs1MMBEpEztl-VD_GDsTNvb6h7m1xywcAKEN1jAIGNaUsHusots9qE6csbUQiX-HA",
                    "IAS": "SEU_DEPLOY_ID_DA_IAS_AQUI"
                }
            }
        };

        // Função utilitária para determinar Ano e Semestre atuais dinamicamente
        function obterPeriodoAtual() {
            const agora = new Date();
            const ano = agora.getFullYear().toString();
            // Jan-Jun (meses 0 a 5) -> "1" | Jul-Dez (meses 6 a 11) -> "2"
            const semestre = (agora.getMonth() <= 5) ? "1" : "2";
            return { "ano": ano, "semestre": semestre };
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const periodoAtual = obterPeriodoAtual();
            
            const subject = urlParams.get('subject');
            const year = urlParams.get('year') || periodoAtual.ano;
            const semester = urlParams.get('semester') || periodoAtual.semestre;

            // Se recebeu parâmetro e o Deploy ID não é vazio, redireciona direto
            if (subject && DEPLOYS[year] && DEPLOYS[year][semester] && DEPLOYS[year][semester][subject]) {
                redirecionar(DEPLOYS[year][semester][subject], urlParams);
            } else {
                // Caso contrário, mostra o formulário pré-selecionando o período atual
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('selectState').style.display = 'block';
                inicializarFormulario(periodoAtual);
            }
        };

        function redirecionar(deploymentId, params) {
            const baseUrl = `https://script.google.com/macros/s/${deploymentId}/exec`;
            
            params.delete('subject');
            params.delete('year');
            params.delete('semester');
            
            const finalUrl = baseUrl + (params.toString() ? "?" + params.toString() : "");
            window.location.href = finalUrl;
        }

        function inicializarFormulario(periodoAtual) {
            const yearSelect = document.getElementById('yearSelect');
            const semesterSelect = document.getElementById('semesterSelect');
            const subjectSelect = document.getElementById('subjectSelect');

            const anos = Object.keys(DEPLOYS).sort().reverse();
            const anoPadrao = DEPLOYS[periodoAtual.ano] ? periodoAtual.ano : anos[0];

            // Injeta o atributo 'selected' diretamente no HTML
            yearSelect.innerHTML = anos.map(a => 
                `<option value="${a}" ${a === anoPadrao ? 'selected' : ''}>${a}</option>`
            ).join('');

            function atualizarSemestres() {
                const anoSel = yearSelect.value;
                const semestresDisponiveis = Object.keys(DEPLOYS[anoSel] || {}).sort().reverse();
                
                // Escolhe o semestre atual se ele existir no ano selecionado
                const semPadrao = (DEPLOYS[anoSel] && DEPLOYS[anoSel][periodoAtual.semestre]) 
                    ? periodoAtual.semestre 
                    : semestresDisponiveis[0];

                // Injeta 'selected' diretamente na tag <option>
                semesterSelect.innerHTML = semestresDisponiveis.map(s => 
                    `<option value="${s}" ${s === semPadrao ? 'selected' : ''}>${s}º Semestre</option>`
                ).join('');
                
                atualizarDisciplinas();
            }

            function atualizarDisciplinas() {
                const anoSel = yearSelect.value;
                const semSel = semesterSelect.value;
                const disciplinas = Object.keys((DEPLOYS[anoSel] && DEPLOYS[anoSel][semSel]) || {});
                
                subjectSelect.innerHTML = disciplinas.map(d => 
                    `<option value="${d}">${d}</option>`
                ).join('');
            }

            yearSelect.addEventListener('change', atualizarSemestres);
            semesterSelect.addEventListener('change', atualizarDisciplinas);

            atualizarSemestres();

            document.getElementById('selectionForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const y = yearSelect.value;
                const s = semesterSelect.value;
                const sub = subjectSelect.value;

                if (DEPLOYS[y] && DEPLOYS[y][s] && DEPLOYS[y][s][sub]) {
                    const deployId = DEPLOYS[y][s][sub];
                    const urlParams = new URLSearchParams(window.location.search);
                    redirecionar(deployId, urlParams);
                } else {
                    alert('Deploy não encontrado ou ID ainda não preenchido para esta disciplina.');
                }
            });
        }
    </script>
    <script>
      // 1. Lógica do "Guarda de Trânsito" (Roda assim que a página abre)
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      
      // Coloque a URL do seu Web App (GAS) aqui
      const URL_DO_GAS = "https://script.google.com/macros/s/SEU_ID_DO_GAS_AQUI/exec";

      if (token) {
        // Se tem token, o aluno veio do email! 
        // Esconde o container inteiro do formulário
        document.querySelector('.container').style.display = 'none';
        
        // Mostra um aviso na tela enquanto redireciona
        document.body.innerHTML = '<h3 style="text-align:center; color:#004a8e; margin-top:20vh;">Autenticando... Redirecionando para o seu boletim.</h3>';
        
        // Redireciona passando os mesmos parâmetros da URL
        window.location.href = URL_DO_GAS + window.location.search;
      }

      // =================================================================
      // 2. Lógica do Formulário de Recuperação (Só roda se NÃO tiver token e o aluno clicar)
      // =================================================================
      document.getElementById('recoveryForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        // ... (todo aquele seu código do google.script.run.reenviarToken fica aqui) ...
      });
    </script>
</body>
</html>
